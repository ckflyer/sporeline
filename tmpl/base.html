{{define "head"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Sporeline</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <a class="brand" href="/">Sporeline<small>cultivation log</small></a>
    {{$c := counts}}
    <nav>
      <a href="/list/all" {{if eq .Tab "all"}}class="on"{{end}}>Everything<span class="n">{{index $c "all"}}</span></a>
      {{range kinds}}<a href="/list/{{.Key}}" {{if eq $.Tab .Key}}class="on"{{end}}><i style="background:{{.Color}}"></i>{{.Plural}}<span class="n">{{index $c .Key}}</span></a>{{end}}
      <div class="railgap"></div>
      <a href="/recipes" {{if eq .Tab "recipes"}}class="on"{{end}}>Recipes<span class="n">{{index $c "recipes"}}</span></a>
      <a href="/stats" {{if eq .Tab "stats"}}class="on"{{end}}>Statistics</a>
      <a href="/data" {{if eq .Tab "data"}}class="on"{{end}}>Data &amp; settings</a>
    </nav>
    <div class="railfoot">
      <a href="/guide">How this works</a>
    </div>
  </aside>
  <div class="content"><div class="inner">
{{end}}

{{define "foot"}}
  </div></div>
</div>
</body>
</html>
{{end}}
