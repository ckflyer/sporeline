{{define "recipes.html"}}{{template "head" .}}
<div class="pagehead">
  <div><h1>Recipes</h1>
  <p class="sub">Written once, scaled when you need a bigger batch.</p></div>
  <a class="btn" href="/recipe-form">Add recipe</a>
</div>
{{if .Data}}
<table>
  <thead><tr><th>Recipe</th><th class="hide-s">Makes</th></tr></thead>
  <tbody>{{range .Data}}
    <tr><td><a href="/recipe/{{.ID}}">{{.Title}}</a></td>
      <td class="hide-s" style="color:var(--muted)">{{.Yield}}</td></tr>
  {{end}}</tbody>
</table>
{{else}}
<div class="empty">
  <h2>No recipes yet</h2>

  <p><a class="btn" href="/recipe-form">Add your first recipe</a></p>
</div>
{{end}}
{{template "foot" .}}{{end}}
