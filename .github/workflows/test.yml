# Runs the checks on every push and pull request, so a broken change shows
# a red cross on GitHub long before anyone tries to release it.
name: Test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Sporeline has no dependencies, so there is no go.sum to cache by.
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - name: Windows build compiles
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null .
